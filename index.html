<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0">
    <title>Realtime GPS Speedometer</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0d0e12;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            padding: 30px 20px;
            overflow-x: hidden;
        }
        .header-panel {
            text-align: center;
            width: 100%;
            max-width: 450px;
        }
        .title {
            font-size: 13px;
            font-weight: 800;
            color: #29aafe;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }
        .gps-data-box {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .gps-tag {
            background: linear-gradient(145deg, #16171f, #111217);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 8px 14px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 12px;
        }
        .main-meter-wrapper {
            position: relative;
            width: 320px;
            height: 320px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .compass-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px dashed rgba(41, 170, 254, 0.3);
            border-radius: 50%;
            transition: transform 0.2s linear; /* Tăng tốc độ xoay la bàn */
        }
        .compass-direction {
            position: absolute;
            font-size: 12px;
            font-weight: bold;
            color: rgba(255, 255, 255, 0.3);
        }
        .dir-n { top: 8px; left: 50%; transform: translateX(-50%); color: #ff4a4a; }
        .dir-e { right: 8px; top: 50%; transform: translateY(-50%); }
        .dir-s { bottom: 8px; left: 50%; transform: translateX(-50%); }
        .dir-w { left: 8px; top: 50%; transform: translateY(-50%); }

        .speed-display {
            text-align: center;
            z-index: 2;
        }
        #speed-text {
            font-size: 100px;
            font-weight: 900;
            line-height: 0.9;
            font-family: 'Arial Black', Gadget, sans-serif;
            color: #ffffff;
            text-shadow: 0 0 30px rgba(41, 170, 254, 0.6);
        }
        .unit-text {
            font-size: 14px;
            color: #7f8c8d;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 2px;
            margin-top: 5px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            width: 100%;
            max-width: 400px;
            margin: 20px 0;
        }
        .stat-card {
            background: linear-gradient(145deg, #14151b, #0f1014);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
        }
        .stat-label {
            font-size: 11px;
            color: #7f8c8d;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        .stat-value {
            font-size: 20px;
            font-weight: bold;
            font-family: monospace;
        }
        .status-panel {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        #status-msg {
            font-size: 13px;
            color: #00ff66; /* Đổi thành màu xanh báo hệ thống tự chạy */
            line-height: 1.6;
            font-weight: bold;
        }
        #accuracy-text {
            font-size: 11px;
            color: #555;
            margin-top: 10px;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <div class="header-panel">
        <div class="title">Hệ Thống Đo Vệ Tinh GPS Siêu Nhạy</div>
        <div class="gps-data-box">
            <div class="gps-tag">LAT: <span id="lat-val" style="color: #fff">0.000000</span></div>
            <div class="gps-tag">LNG: <span id="lng-val" style="color: #fff">0.000000</span></div>
        </div>
    </div>

    <div class="main-meter-wrapper">
        <div class="compass-ring" id="compass">
            <div class="compass-direction dir-n">N</div>
            <div class="compass-direction dir-e">E</div>
            <div class="compass-direction dir-s">S</div>
            <div class="compass-direction dir-w">W</div>
        </div>
        <div class="speed-display">
            <div id="speed-text">0</div>
            <div class="unit-text">Km/h</div>
        </div>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-label">Tốc độ tối đa</div>
            <div class="stat-value" id="max-speed">0 <span style="font-size:12px; color:#555">km/h</span></div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Hướng đi</div>
            <div class="stat-value" id="heading-val">--°</div>
        </div>
    </div>

    <div class="status-panel">
        <div id="status-msg">🔄 ĐANG TỰ ĐỘNG ĐỒNG BỘ GPS...</div>
        <div id="accuracy-text">Đang quét sóng vệ tinh...</div>
    </div>

    <script>
        let topRecordedSpeed = 0;

        // Hàm này tự động kích hoạt ngay khi trang web vừa tải xong
        window.onload = function() {
            if (!navigator.geolocation) {
                document.getElementById('status-msg').innerHTML = "<span style='color: #ff4a4a;'>Trình duyệt không hỗ trợ GPS!</span>";
                return;
            }

            const options = {
                enableHighAccuracy: true, 
                timeout: 10000,           
                maximumAge: 0             // Bắt buộc xóa cache tọa độ cũ để lấy số mới tinh liên tục
            };

            // Gọi lệnh lắng nghe liên tục không cần người dùng bấm nút
            navigator.geolocation.watchPosition(processGpsMetrics, catchGpsFault, options);
        };

        function processGpsMetrics(position) {
            const data = position.coords;
            
            document.getElementById('lat-val').innerText = data.latitude.toFixed(6);
            document.getElementById('lng-val').innerText = data.longitude.toFixed(6);
            document.getElementById('accuracy-text').innerText = `Sai số phần cứng: ±${data.accuracy.toFixed(1)} mét`;

            // Cập nhật la bàn nhanh
            if (data.heading !== null && !isNaN(data.heading)) {
                document.getElementById('heading-val').innerText = `${Math.round(data.heading)}°`;
                document.getElementById('compass').style.transform = `rotate(${-data.heading}deg)`;
            }

            // XỬ LÝ ĐO TỐC ĐỘ SIÊU NHẠY: Nhận data thô trực tiếp từ chip vệ tinh, không lọc giảm nhiễu
            let rawSpeed = data.speed;

            if (rawSpeed !== null && rawSpeed >= 0 && !isNaN(rawSpeed)) {
                let speedKmH = rawSpeed * 3.6;
                
                // Hiển thị thẳng số thực tế lên màn hình
                document.getElementById('speed-text').innerText = Math.round(speedKmH);

                if (speedKmH > topRecordedSpeed) {
                    topRecordedSpeed = speedKmH;
                    document.getElementById('max-speed').innerHTML = `${Math.round(topRecordedSpeed)} <span style='font-size:12px; color:#555'>km/h</span>`;
                }
                document.getElementById('status-msg').innerHTML = "🟢 TÍN HIỆU VỆ TINH HOÀN HẢO";
            } else {
                // Nếu đứng im nhưng chip vẫn trả về dữ liệu nhiễu nhỏ, nó vẫn sẽ nhảy số thay vì ép về 0
                document.getElementById('status-msg').innerHTML = "🟡 ĐÃ KẾT NỐI VỆ TINH (HÃY DI CHUYỂN)";
            }
        }

        function catchGpsFault(error) {
            const statusMsg = document.getElementById('status-msg');
            switch(error.code) {
                case error.PERMISSION_DENIED:
                    statusMsg.innerHTML = "<span style='color: #ff4a4a;'>LỖI: Hãy cho phép quyền vị trí trong cài đặt trình duyệt!</span>";
                    break;
                case error.POSITION_UNAVAILABLE:
                    statusMsg.innerHTML = "<span style='color: #ffbc4a;'>LỖI: Vui lòng bật vị trí (GPS) trên điện thoại!</span>";
                    break;
                case error.TIMEOUT:
                    statusMsg.innerHTML = "<span style='color: #ffbc4a;'>Đang tìm lại sóng GPS (Bạn đang ở trong nhà)...</span>";
                    break;
            }
        }
    </script>
</body>
</html>
